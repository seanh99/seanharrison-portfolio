<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso al portfolio – Sean Harrison</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="password-gate" id="passwordGate" style="position:fixed;">
  <form class="gate-form" id="gateForm">
    <p class="gate-logo">SEAN HARRISON</p>
    <label class="eyebrow gate-label" for="gatePassword">Acceso al portfolio</label>
    <input type="password" id="gatePassword" class="gate-input" autocomplete="current-password" required>
    <button type="button" class="gate-toggle" id="gateToggle">Mostrar contraseña</button>
    <button type="submit" class="link-arrow gate-submit">Entrar</button>
    <p class="gate-error" id="gateError" hidden>Contraseña incorrecta. Inténtalo de nuevo.</p>
    <a class="gate-request" href="mailto:seanharrison.coelho@gmail.com?subject=Solicitud%20de%20acceso%20al%20portfolio">¿No tenés contraseña? Solicitar acceso</a>
  </form>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/es/';
  const form = document.getElementById('gateForm');
  const input = document.getElementById('gatePassword');
  const error = document.getElementById('gateError');
  const toggle = document.getElementById('gateToggle');
  const submitBtn = form.querySelector('.gate-submit');

  toggle.addEventListener('click', () => {
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    toggle.textContent = showing ? 'Mostrar contraseña' : 'Ocultar contraseña';
    input.focus({ preventScroll: true });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.hidden = true;
    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value, next }),
      });
      if (res.ok) {
        const data = await res.json();
        location.href = data.next || '/es/';
      } else {
        error.hidden = false;
        submitBtn.disabled = false;
      }
    } catch (err) {
      error.hidden = false;
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
