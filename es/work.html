/01-entrance-facade-c.jpg","images":[{"src":"../assets/images/casa-el-naudir/01-entrance-facade-c.jpg","alt":"El Naudir House: Entrance facade"},{"src":"../assets/images/casa-el-naudir/02-pool-garden-facade.jpg","alt":"El Naudir House: Pool garden facade"},{"src":"../assets/images/casa-el-naudir/03-living-lake-view.jpg","alt":"El Naudir House: Living lake view"}]},{"slug":"bowas-soho","title":"Bowas Soho","location":"Palermo Soho, Buenos Aires, Argentina","year":"","area":"Approx. 2,050 m²; approx. 25 residences plus commercial space and amenities","category":"Desarrollo residencial","status":"En construcción, próximo a finalizar","developedAt":"","independentLabel":"Encargo directo de Bowas","description":"","involvement":"Bowas me contrató directamente para estudiar el potencial de desarrollo de un terreno en Palermo Soho. Tras el estudio inicial de prefactibilidad, desarrollé de manera proactiva una propuesta arquitectónica que derivó en un encargo completo hasta la etapa de tramitación. Mi trabajo abarcó definición de producto, distribuciones de viviendas, cortes y fachadas, coordinación estructural, estrategia material y la documentación necesaria para la presentación municipal. Posteriormente el proyecto fue transferido a un equipo local para su construcción. Aunque algunos elementos de fachada evolucionaron, el edificio mantuvo varios aspectos principales de la propuesta original, incluida la dirección material.","featured":false,"hero":"../assets/images/bowas-soho/01-facade-front-c.jpg","images":[{"src":"../assets/images/bowas-soho/01-facade-front-c.jpg","alt":"Bowas Soho: Facade front"},{"src":"../assets/images/bowas-soho/02-entrance-detail.jpg","alt":"Bowas Soho: Entrance detail"},{"src":"../assets/images/bowas-soho/03-facade-rear.jpg","alt":"Bowas Soho: Facade rear"},{"src":"../assets/images/bowas-soho/04-studio-general.jpg","alt":"Bowas Soho: Studio general"},{"src":"../assets/images/bowas-soho/05-living-room.jpg","alt":"Bowas Soho: Living room"},{"src":
