ugh a sequence of long horizontal volumes. Deep concrete slabs, operable timber screens and shaded terraces mediate between domestic life and the surrounding rainforest.","featured":true,"caseStudy":false,"hero":"assets/images/casa-jungla/01-aerial-distant-c.jpg","images":[{"src":"assets/images/casa-jungla/00-cover.jpg","alt":"Casa Jungla — Cover"},{"src":"assets/images/casa-jungla/01-aerial-distant-c.jpg","alt":"Casa Jungla — Aerial distant"},{"src":"assets/images/casa-jungla/02-approach-walkway-c.jpg","alt":"Casa Jungla — Approach walkway"},{"src":"assets/images/casa-jungla/03-interior-living.jpg","alt":"Casa Jungla — Interior living"},{"src":"assets/images/casa-jungla/04-exterior-pool-deck.jpg","alt":"Casa Jungla — Exterior pool deck"},{"src":"assets/images/casa-jungla/05-exterior-detail-shutters.jpg","alt":"Casa Jungla — Exterior detail shutters"},{"src":"assets/images/casa-jungla/06-interior-bedroom.jpg","alt":"Casa Jungla — Interior bedroom"},{"src":"assets/images/casa-jungla/07-interior-bathroom.jpg","alt":"Casa Jungla — Interior bathroom"},{"src":"assets/images/casa-jungla/08-exterior-night.jpg","alt":"Casa Jungla — Exterior night"}]},{"slug":"casa-jardines-atlanticos","title":"Casa José Ignacio","location":"José Ignacio, Uruguay","year":"2026","category":"Residential","status":"","studio":"","role":["Concept design","Architecture","Interior design and visual direction"],"description":"Una casa costera organizada como una secuencia de pabellones, patios y jardines protegidos del viento atlántico. Su arquitectura combina muros de ladrillo artesanal, aleros profundos y espacios de transición.","featured":true,"caseStudy":false,"hero":"assets/images/jose-ignacio/02-view-from-beach-c.jpg","images":[{"src":"assets/images/jose-ignacio/01-aerial-view.jpg","alt":"Casa José Ignacio — Aerial view"},{"src":"assets/images/jose-ignacio/02-view-from-beach-c.jpg","alt":"Casa José Ignacio — View from beach"},{"src":"assets/images/jose-ignacio/03-access.jpg","alt":"Casa José Ignacio — Access"},{"src":"assets/images/jose-ignacio/05-private-lounge.jpg","alt":"Casa José Ignacio — Private lounge"},{"src":"assets/images/jose-ignacio/08-dining-room.jpg","alt":"Casa José Ignacio — Dining room"},{"src":"assets/images/jose-ignacio/09-garden-view.jpg","alt":"Casa José Ignacio — Garden view"}]},{"slug":"casa-nada","title":"Casa Nada","location":"Espiñeirido, Galicia, Spain","year":"","category":"Residential","status":"","studio":"","role":["Architect / Independent Project"],"description":"","featured":false,"caseStudy":false,"hero":"","images":[]},{"slug":"humlebaek-house","title":"Humlebaek House","location":"Humlebaek, Denmark","year":"","category":"Residential","status":"","studio":"","role":["Concept design","Client management","Drawings","Procurement","Site assistance — RFIs and submittals"],"description":"An independent commission for a family home outside Copenhagen, carried from initial concept through construction: client-facing design development, drawings, procurement and site assistance including RFIs and submittals.","featured":false,"caseStudy":false,"hero":"assets/images/humlebaek-house/01-exterior-street-c.jpg","images":[{"src":"assets/images/humlebaek-house/01-exterior-street-c.jpg","alt":"Humlebaek House — Exterior street"},{"src":"assets/images/humlebaek-house/02-living-room-library.jpg","alt":"Humlebaek House — Living room library"},{"src":"assets/images/humlebaek-house/03-dining-living-open-plan.jpg","alt":"Humlebaek House — Dining living open plan"},{"src":"assets/images/humlebaek-house/04-kitchen.jpg","alt":"Humlebaek House — Kitchen"},{"src":"assets/images/humlebaek-house/05-primary-bedroom.jpg","alt":"Humlebaek House — Primary bedroom"},{"src":"assets/images/humlebaek-house/06-bedroom-1.jpg","alt":"Humlebaek House — Bedroom 1"},{"src":"assets/images/humlebaek-house/07-bedroom-2.jpg","alt":"Humlebaek House — Bedroom 2"},{"src":"assets/images/humlebaek-house/08-office.jpg","alt":"Humlebaek House — Office"},{"src":"assets/images/humlebaek-house/09-playroom.jpg","alt":"Humlebaek House — Playroom"},{"src":"assets/images/humlebaek-house/10-media-room.jpg","alt":"Humlebaek House — Media room"},{"src":"assets/images/humlebaek-house/11-living-room-evening.jpg","alt":"Humlebaek House — Living room evening"}]},{"slug":"caledonian-road-apartment","title":"Caledonian Road","location":"London, United Kingdom","year":"2022&ndash;23","category":"Hospitality / Residential Conversion","status":"","studio":"","role":["Architectural concept","Spatial strategy","Extension studies","Interior architecture","FF&amp;E design","Visual direction"],"description":"Developed for a private investor, the project explored the conversion of four adjoining London townhouses into a coordinated short-stay residential product.\n\nThe work established the overall spatial strategy, including access, ground-floor and basement extensions, additional mansard accommodation and the internal configuration of the individual units. The architectural proposal was developed alongside the interior concept, material palette and FF&amp;E specification to create a consistent identity across the properties while retaining the scale and character of the existing buildings.","featured":false,"caseStudy":false,"hero":"assets/images/caledonian-road-apartment/01-living-room-c.jpg","images":[{"src":"assets/images/caledonian-road-apartment/01-living-room-c.jpg","alt":"Caledonian Road — Living room"},{"src":"assets/images/caledonian-road-apartment/02-hall-corridor.jpg","alt":"Caledonian Road — Hall corridor"},{"src":"assets/images/caledonian-road-apartment/03-dining-kitchen.jpg","alt":"Caledonian Road — Dining kitchen"}]},{"slug":"puertos-del-lago-ii","title":"Casa Riberas","location":"Barrio Riberas, Puertos del Lago, Buenos Aires, Argentina","year":"2018","category":"Private Residence","status":"Design and Municipal Approval Package Completed &middot; Construction by Client-Appointed Team","studio":"","role":["Feasibility study","Concept design","Architectural design","Municipal approval documentation","Ad hoc construction support"],"description":"Commission for a private residence developed from the initial project definition through municipal approval. The work included the overall architectural concept, spatial organisation, material strategy and preparation of the documentation required for approval.\n\nFollowing completion of the design package, the clients appointed their own construction team and managed the delivery of the house independently.\n\nThe project was conceived as a contemporary family home organised around a strong relationship between interior spaces, garden and outdoor living areas. Large openings, protected terraces and layered fa&ccedil;ade elements balance openness with privacy, while a restrained material palette gives continuity to the different volumes.\n\nThe architecture combines clear horizontal planes with vertical timber elements, using changes in depth, transparency and material to articulate the elevations without relying on excessive formal gestures.\n\nA complete architectural and municipal approval package was delivered to the clients, who subsequently appointed their own construction team to execute the project. Limited architectural support continued during construction when specific design clarifications or additional details were required.","featured":false,"caseStudy":false,"hero":"assets/images/puertos-del-lago-ii/01-facade-day-c.jpg","images":[{"src":"assets/images/puertos-del-lago-ii/01-facade-day-c.jpg","alt":"Casa Riberas — Facade day"},{"src":"assets/images/puertos-del-lago-ii/02-rear-garden-pool.jpg","alt":"Casa Riberas — Rear garden pool"}]},{"slug":"casa-estancias-del-pilar","title":"Casa Estancias del Pilar","location":"Pilar, Argentina","year":"","category":"Residential","status":"","studio":"","role":["Architect / Independent Project"],"description":"","featured":false,"caseStudy":false,"hero":"","images":[]},{"slug":"casa-el-naudir","title":"El Naudir House","location":"El Naudir, Puertos del Lago, Buenos Aires, Argentina","year":"2025","category":"Private Residence","status":"Design and Licensing Package Completed","studio":"","role":["Plot selection","Feasibility study","Concept design","Architectural design","Licensing documentation"],"description":"Commission for a private residence within El Naudir, Puertos del Lago. The engagement began prior to the acquisition of the site, including plot assessment and selection, and continued through the development of the architectural concept and documentation required for licensing.\n\nThe project was developed around the relationship between the house, its lakefront setting and the internal landscape. The design establishes a sequence from a more controlled street frontage to increasingly open living spaces towards the garden and water, using double-height volumes, deep overhangs and large framed openings to strengthen the connection between interior and exterior.\n\nA complete architectural and licensing package was delivered to the client, providing the basis for contractor selection and the subsequent construction phase.","featured":false,"caseStudy":false,"hero":"assets/images/casa-el-naudir/01-pool-garden-facade-c.jpg","images":[{"src":"assets/images/casa-el-naudir/01-pool-garden-facade-c.jpg","alt":"El Naudir House — Pool garden facade"},{"src":"assets/images/casa-el-naudir/02-entrance-facade.jpg","alt":"El Naudir House — Entrance facade"},{"src":"assets/images/casa-el-naudir/03-living-lake-view.jpg","alt":"El Naudir House — Living lake view"}]},{"slug":"bowas-soho","title":"Bowas Soho","location":"Palermo Soho, Buenos Aires","year":"","category":"Residential Development","status":"","studio":"","role":["Product strategy","Feasibility studies","Architectural concept","Interior design","Planning documentation"],"description":"Developed for Bowas as an urban residential product for Palermo Soho, the project combined market positioning, feasibility and architectural design. The strategy established a diverse unit mix, shared amenities and ground-floor commercial space around a contemporary live-work lifestyle.\n\nThe work extended from early product definition and architectural concept through interior design and planning documentation.","featured":false,"caseStudy":false,"hero":"assets/images/bowas-soho/01-facade-front-c.jpg","images":[{"src":"assets/images/bowas-soho/01-facade-front-c.jpg","alt":"Bowas Soho — Facade front"},{"src":"assets/images/bowas-soho/02-facade-rear.jpg","alt":"Bowas Soho — Facade rear"},{"src":"assets/images/bowas-soho/03-entrance-detail.jpg","alt":"Bowas Soho — Entrance detail"},{"src":"assets/images/bowas-soho/04-studio-general.jpg","alt":"Bowas Soho — Studio general"},{"src":"assets/images/bowas-soho/05-studio-detail.jpg","alt":"Bowas Soho — Studio detail"},{"src":"assets/images/bowas-soho/06-amenity-room.jpg","alt":"Bowas Soho — Amenity room"},{"src":"assets/images/bowas-soho/07-rooftop-pool.jpg","alt":"Bowas Soho — Rooftop pool"},{"src":"assets/images/bowas-soho/08-living-room.jpg","alt":"Bowas Soho — Living room"},{"src":"assets/images/bowas-soho/09-concept-sketch.jpg","alt":"Bowas Soho — Concept sketch"}]},{"slug":"bowas-conesa","title":"Bowas Conesa","location":"Colegiales, Buenos Aires","year":"","category":"Residential Development","status":"","studio":"","role":["Product strategy","Feasibility studies","Architectural concept","Interior design","Planning documentation"],"description":"Conceived as Bowas&rsquo; first residential development in Colegiales, the project translated the characteristics of a low-rise corner site into a distinct housing product. Feasibility and product studies informed the unit mix, layouts and relationship between private and shared outdoor space.\n\nThe architectural concept was developed alongside the interior design and planning documentation, with all residences oriented towards the street and larger units and communal amenities occupying the upper levels.","featured":false,"caseStudy":false,"hero":"assets/images/bowas-conesa/01-facade-corner-c.jpg","images":[{"src":"assets/images/bowas-conesa/01-facade-corner-c.jpg","alt":"Bowas Conesa — Facade corner"},{"src":"assets/images/bowas-conesa/02-facade-detail-angle.jpg","alt":"Bowas Conesa — Facade detail angle"},{"src":"assets/images/bowas-conesa/03-facade-evening.jpg","alt":"Bowas Conesa — Facade evening"},{"src":"assets/images/bowas-conesa/04-bedroom.jpg","alt":"Bowas Conesa — Bedroom"},{"src":"assets/images/bowas-conesa/05-rooftop-terrace-grill.jpg","alt":"Bowas Conesa — Rooftop terrace grill"},{"src":"assets/images/bowas-conesa/06-lobby-elevator.jpg","alt":"Bowas Conesa — Lobby elevator"}]},{"slug":"bonita-village","title":"Bonita Village","location":"Naples, Florida, USA","year":"","category":"Hospitality","status":"Concept","studio":"","role":["Architect / Independent Project"],"description":"","featured":false,"caseStudy":false,"hero":"","images":[]},{"slug":"maribor-country-house","title":"Maribor Country House","location":"Maribor Countryside, Slovenia","year":"2024","category":"Private Residence / Country House","status":"Concept Design Completed","studio":"","role":["Concept design","Spatial strategy","Architectural and material direction"],"description":"Concept proposal for a private country house in a rural village outside Maribor, Slovenia. The project explored how a contemporary residence could sit naturally within a wooded, low-density landscape while retaining the directness and solidity associated with traditional rural architecture.\n\nThe house is conceived as a low, elongated volume organised beneath a simple pitched roof. Rather than treating the landscape as a backdrop, the plan and section are shaped around long views, sheltered outdoor spaces and a continuous relationship between the interior and the garden.\n\nA restrained palette of light brick, timber and large glazed openings gives the building a quiet, monolithic character externally, while the interiors become warmer and more tactile through extensive timber surfaces and natural finishes.","featured":false,"caseStudy":false,"hero":"assets/images/maribor-country-house/01-exterior-pool-c.jpg","images":[{"src":"assets/images/maribor-country-house/01-exterior-pool-c.jpg","alt":"Maribor Country House — Exterior pool"},{"src":"assets/images/maribor-country-house/02-exterior-brick-detail.jpg","alt":"Maribor Country House — Exterior brick detail"},{"src":"assets/images/maribor-country-house/03-living-dining-pool-view.jpg","alt":"Maribor Country House — Living dining pool view"},{"src":"assets/images/maribor-country-house/04-living-room-interior.jpg","alt":"Maribor Country House — Living room interior"},{"src":"assets/images/maribor-country-house/05-living-room-fireplace.jpg","alt":"Maribor Country House — Living room fireplace"}]},{"slug":"belgrano-house","title":"Belgrano House","location":"Belgrano, Buenos Aires, Argentina","year":"2018","category":"Private Residence / Renovation","status":"Design Package Completed","studio":"","role":["Renovation concept","Architectural design","Interior design","Material and finish selection","Joinery and detail design"],"description":"Renovation of an existing private residence in Belgrano, Buenos Aires, developed independently in collaboration with a local furniture studio. The commission formed part of an ongoing collaboration in which I developed the architectural and interior design of residential projects, while the studio contributed the furniture selection and supply.\n\nThe project reworked the existing house through a restrained contemporary language, balancing the character of the original building with a warmer and more precise interior atmosphere.\n\nExternally, the intervention simplifies the composition through light rendered surfaces, timber elements and carefully framed openings, creating a quieter relationship with the mature tree-lined streets typical of Belgrano.\n\nInternally, the renovation combines warm oak flooring, subtle wall mouldings, natural stone and controlled lighting. The intention was to create spaces that feel residential and layered rather than overly styled, allowing furniture and materiality to carry most of the visual character.\n\nA complete renovation and interior design proposal was developed for the client, defining the architectural intervention, spatial character, material palette and key interior details, with furniture specified and supplied by the collaborating studio.","featured":false,"caseStudy":false,"hero":"assets/images/belgrano-house/01-street-facade-c.jpg","images":[{"src":"assets/images/belgrano-house/01-street-facade-c.jpg","alt":"Belgrano House — Street facade"},{"src":"assets/images/belgrano-house/02-dining-kitchen.jpg","alt":"Belgrano House — Dining kitchen"},{"src":"assets/images/belgrano-house/03-staircase.jpg","alt":"Belgrano House — Staircase"},{"src":"assets/images/belgrano-house/04-powder-room.jpg","alt":"Belgrano House — Powder room"}]}]</script>
