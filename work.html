.jpg","images":[{"src":"assets/images/casa-canton-2/01-tree-branches-window.jpg","alt":"Casa Canton 2: Tree branches window"},{"src":"assets/images/casa-canton-2/02-tree-shadow-facade.jpg","alt":"Casa Canton 2: Tree shadow facade"},{"src":"assets/images/casa-canton-2/03-dusk-exterior-c.jpg","alt":"Casa Canton 2: Dusk exterior"},{"src":"assets/images/casa-canton-2/04-covered-terrace.jpg","alt":"Casa Canton 2: Covered terrace"},{"src":"assets/images/casa-canton-2/05-interior-construction.jpg","alt":"Casa Canton 2: Interior construction"},{"src":"assets/images/casa-canton-2/06-exterior-twilight-alt.jpg","alt":"Casa Canton 2: Exterior twilight alt"}]},{"slug":"casa-acassuso","title":"Casa Acassuso","location":"Acassuso, Argentina","year":"","area":"","category":"Residential","status":"Unbuilt","developedAt":"ID Construcciones","independentLabel":"","description":"Casa Acassuso is a single-family house in Acassuso, Argentina, taken from concept through design development at ID Construcciones.","involvement":"Sean developed Casa Acassuso from concept design through design development. The project did not move forward to construction.","featured":false,"hero":"assets/images/casa-acassuso/01-exterior-night-c.jpg","images":[{"src":"assets/images/casa-acassuso/01-exterior-night-c.jpg","alt":"Casa Acassuso: Exterior night"},{"src":"assets/images/casa-acassuso/02-axonometric.jpg","alt":"Casa Acassuso: Axonometric"},{"src":"assets/images/casa-acassuso/03-floor-plans.jpg","alt":"Casa Acassuso: Floor plans"}]},{"slug":"casa-jungla","title":"Casa Jungla","location":"Samaná, Dominican Republic","year":"2026","area":"840 m²","category":"Residential","status":"","developedAt":"","independentLabel":"Independent commission","description":"Conceived as a precise intervention within a steep tropical landscape, Casa Jungla follows the contours of the mountain through a sequence of long horizontal volumes. Deep concrete slabs, operable timber screens and shaded terraces mediate between domestic life and the surrounding rainforest.","involvement":"Casa Jungla is an independent private commission. Sean developed the architectural concept and interior direction, together with a preliminary design sufficient for the client to pursue planning and permitting for the project.","featured":true,"hero":"assets/images/casa-jungla/01-aerial-distant-c.jpg","images":[{"src":"assets/images/casa-jungla/00-cover.jpg","alt":"Casa Jungla: Cover"},{"src":"assets/images/casa-jungla/01-aerial-distant-c.jpg","alt":"Casa Jungla: Aerial distant"},{"src":"assets/images/casa-jungla/02-approach-walkway-c.jpg","alt":"Casa Jungla: Approach walkway"},{"src":"assets/images/casa-jungla/03-interior-living.jpg","alt":"Casa Jungla: Interior living"},{"src":"assets/images/casa-jungla/04-exterior-pool-deck.jpg","alt":"Casa Jungla: Exterior pool deck"},{"src":"assets/images/casa-jungla/05-exterior-detail-shutters.jpg","alt":"Casa Jungla: Exterior detail shutters"},{"src":"assets/images/casa-jungla/06-interior-bedroom.jpg","alt":"Casa Jungla: Interior bedroom"},{"src":"assets/images/casa-jungla/07-interior-bathroom.jpg","alt":"Casa Jungla: Interior bathroom"},{"src":"assets/images/casa-jungla/08-exterior-night.jpg","alt":"Casa Jungla: Exterior night"}]},{"slug":"casa-jardines-atlanticos","title":"Casa José Ignacio","location":"José Ignacio, Uruguay","year":"2026","area":"900 m²","category":"Residential","status":"","developedAt":"","independentLabel":"Independent commission","description":"A coastal house organised as a sequence of pavilions, courtyards and gardens sheltered from the Atlantic wind. Its architecture combines handcrafted brick walls, deep eaves and transitional spaces.","involvement":"Casa José Ignacio is an independent private commission. Sean developed the concept and preliminary architectural design to a level sufficient for the client to pursue planning and permitting.","featured":false,"hero":"assets/images/jose-ignacio/02-view-from-beach-c.jpg","images":[{"src":"assets/images/jose-ignacio/01-aerial-view.jpg","alt":"Casa José Ignacio: Aerial view"},{"src":"assets/images/jose-ignacio/02-view-from-beach-c.jpg","alt":"Casa José Ignacio: View from beach"},{"src":"assets/images/jose-ignacio/03-access.jpg","alt":"Casa José Ignacio: Access"},{"src":"assets/images/jose-ignacio/05-private-lounge.jpg","alt":"Casa José Ignacio: Private lounge"},{"src":"assets/images/jose-ignacio/08-dining-room.jpg","alt":"Casa José Ignacio: Dining room"},{"src":"assets/images/jose-ignacio/09-garden-view.jpg","alt":"Casa José Ignacio: Garden view"}]},{"slug":"humlebaek-house","title":"Humlebaek House","location":"Humlebaek, Denmark","year":"","area":"","category":"Residential","status":"","developedAt":"","independentLabel":"Independent commission","description":"Humlebaek House is a family home outside Copenhagen, developed as an independent private commission from initial concept through construction.","involvement":"Sean developed the concept design and detailed architectural information for Humlebaek House, together with the interior design, lighting and subcontractor coordination. He provided design management and remote construction support throughout the build, with two site visits, without acting as a full-time site architect.","featured":true,"hero":"assets/images/humlebaek-house/01-exterior-street-c.jpg","images":[{"src":"assets/images/humlebaek-house/01-exterior-street-c.jpg","alt":"Humlebaek House: Exterior street"},{"src":"assets/images/humlebaek-house/02-living-room-library.jpg","alt":"Humlebaek House: Living room library"},{"src":"assets/images/humlebaek-house/03-dining-living-open-plan.jpg","alt":"Humlebaek House: Dining living open plan"},{"src":"assets/images/humlebaek-house/04-kitchen.jpg","alt":"Humlebaek House: Kitchen"},{"src":"assets/images/humlebaek-house/05-primary-bedroom.jpg","alt":"Humlebaek House: Primary bedroom"},{"src":"assets/images/humlebaek-house/06-bedroom-1.jpg","alt":"Humlebaek House: Bedroom 1"},{"src":"assets/images/humlebaek-house/07-bedroom-2.jpg","alt":"Humlebaek House: Bedroom 2"},{"src":"assets/images/humlebaek-house/08-office.jpg","alt":"Humlebaek House: Office"},{"src":"assets/images/humlebaek-house/09-playroom.jpg","alt":"Humlebaek House: Playroom"},{"src":"assets/images/humlebaek-house/10-media-room.jpg","alt":"Humlebaek House: Media room"},{"src":"assets/images/humlebaek-house/11-living-room-evening.jpg","alt":"Humlebaek House: Living room evening"}]},{"slug":"caledonian-road-apartment","title":"Caledonian Road","location":"London, United Kingdom","year":"2022–23","area":"","category":"Residential Conversion","status":"","developedAt":"","independentLabel":"Independent collaboration","description":"Developed for a private investor, the project explored the conversion of four adjoining London townhouses into a coordinated short-stay residential product.","involvement":"Caledonian Road was an independent collaboration developed through Harrison Jones with Clifford Jones. Sean's work included the architectural concept, spatial strategy, extension studies, interior architecture and FF&E strategy for the four buildings. The project was subsequently developed further by another practice, and the final built result differs significantly from this stage of the work.","featured":false,"hero":"assets/images/caledonian-road-apartment/01-living-room-c.jpg","images":[{"src":"assets/images/caledonian-road-apartment/01-living-room-c.jpg","alt":"Caledonian Road: Living room"},{"src":"assets/images/caledonian-road-apartment/02-hall-corridor.jpg","alt":"Caledonian Road: Hall corridor"},{"src":"assets/images/caledonian-road-apartment/03-dining-kitchen.jpg","alt":"Caledonian Road: Dining kitchen"}]},{"slug":"puertos-del-lago-ii","title":"Casa Riberas","location":"Barrio Riberas, Puertos del Lago, Buenos Aires, Argentina","year":"2018","area":"","category":"Private Residence","status":"Design and municipal approval complete","developedAt":"","independentLabel":"Private commission","description":"Casa Riberas is a private residence in the Puertos del Lago development in Buenos Aires, organised as a contemporary family home around a strong relationship between interior spaces, garden and outdoor living areas.","involvement":"Casa Riberas was a private commission for friends. Sean developed the architectural proposal and the municipal approval package for the house. Construction was organised directly by the clients, with Sean providing occasional design clarifications and support when needed during the build.","featured":false,"hero":"assets/images/puertos-del-lago-ii/01-facade-day-c.jpg","images":[{"src":"assets/images/puertos-del-lago-ii/01-facade-day-c.jpg","alt":"Casa Riberas: Facade day"},{"src":"assets/images/puertos-del-lago-ii/02-rear-garden-pool.jpg","alt":"Casa Riberas: Rear garden pool"}]},{"slug":"casa-el-naudir","title":"El Naudir House","location":"El Naudir, Puertos del Lago, Buenos Aires, Argentina","year":"2025","area":"","category":"Private Residence","status":"Design and licensing package complete","developedAt":"","independentLabel":"Independent commission","description":"El Naudir House is a private lakefront residence within El Naudir, Puertos del Lago, organised around the relationship between the house, its setting and the internal landscape.","involvement":"El Naudir House is an independent private commission. Sean developed the site and feasibility studies, the architectural concept and the documentation required for planning and permitting, providing the client with the basis for contractor selection and the subsequent construction phase.","featured":false,"hero":"assets/images/casa-el-naudir/01-pool-garden-facade-c.jpg","images":[{"src":"assets/images/casa-el-naudir/01-pool-garden-facade-c.jpg","alt":"El Naudir House: Pool garden facade"},{"src":"assets/images/casa-el-naudir/02-entrance-facade.jpg","alt":"El Naudir House: Entrance facade"},{"src":"assets/images/casa-el-naudir/03-living-lake-view.jpg","alt":"El Naudir House: Living lake view"}]},{"slug":"bowas-soho","title":"Bowas Soho","location":"Palermo Soho, Buenos Aires, Argentina","year":"","area":"Approx. 2,050 m²; approx. 25 residences plus commercial space and amenities","category":"Residential Development","status":"Under construction, nearing completion","developedAt":"","independentLabel":"Commissioned directly by Bowas","description":"","involvement":"Sean was commissioned directly by Bowas to assess the development potential of a site in Palermo Soho. Following the initial feasibility study, he proactively developed an architectural proposal that led to a full commission through planning. His work covered product definition, apartment layouts, sections and elevations, structural coordination, material strategy and the documentation required for the municipal submission. The project was subsequently transferred to a local team for construction. Although elements of the façade design evolved, the built project retained several key aspects of the original proposal, including the material direction.","featured":false,"hero":"assets/images/bowas-soho/01-facade-front-c.jpg","images":[{"src":"assets/images/bowas-soho/01-facade-front-c.jpg","alt":"Bowas Soho: Facade front"},{"src":"assets/images/bowas-soho/02-facade-rear.jpg","alt":"Bowas Soho: Facade rear"},{"src":"assets/images/bowas-soho/03-entrance-detail.jpg","alt":"Bowas Soho: Entrance detail"},{"src":"assets/images/bowas-soho/04-studio-general.jpg","alt":"Bowas Soho: Studio general"},{"src":"assets/images/bowas-soho/05-studio-detail.jpg","alt":"Bowas Soho: Studio detail"},{"src":"assets/images/bowas-soho/06-amenity-room.jpg","alt":"Bowas Soho: Amenity room"},{"src":"assets/images/bowas-soho/07-rooftop-pool.jpg","alt":"Bowas Soho: Rooftop pool"},{"src":"assets/images/bowas-soho/08-living-room.jpg","alt":"Bowas Soho: Living room"},{"src":"assets/images/bowas-soho/09-concept-sketch.jpg","alt":"Bowas Soho: Concept sketch"}]},{"slug":"bowas-conesa","title":"Bowas Conesa","location":"Colegiales, Buenos Aires, Argentina","year":"","area":"Approx. 1,990 m²; approx. 23 residences","category":"Residential Development","status":"Under construction","developedAt":"","independentLabel":"Commissioned directly by Bowas","description":"","involvement":"Following the feasibility study for a second Bowas site in Colegiales, Sean developed the architectural concept and residential product strategy through planning submission. His work included apartment layouts, common areas, sections and elevations, structural coordination, façade and material strategy and the documentation required for municipal approval. The project was subsequently transferred to a local team for construction. The façade was later refined, while the material concept and overall architectural direction remained closely related to Sean's original proposal.","featured":false,"hero":"assets/images/bowas-conesa/01-facade-corner-c.jpg","images":[{"src":"assets/images/bowas-conesa/01-facade-corner-c.jpg","alt":"Bowas Conesa: Facade corner"},{"src":"assets/images/bowas-conesa/02-facade-detail-angle.jpg","alt":"Bowas Conesa: Facade detail angle"},{"src":"assets/images/bowas-conesa/03-facade-evening.jpg","alt":"Bowas Conesa: Facade evening"},{"src":"assets/images/bowas-conesa/04-bedroom.jpg","alt":"Bowas Conesa: Bedroom"},{"src":"assets/images/bowas-conesa/05-rooftop-terrace-grill.jpg","alt":"Bowas Conesa: Rooftop terrace grill"},{"src":"assets/images/bowas-conesa/06-lobby-elevator.jpg","alt":"Bowas Conesa: Lobby elevator"}]},{"slug":"buenbit-offices","title":"BuenBit Offices","location":"Buenos Aires, Argentina","year":"2020","area":"Approx. 1,150 m²","category":"Workplace / Office Refurbishment","status":"","developedAt":"","independentLabel":"Developed in collaboration with Follett","description":"","involvement":"A full-building workplace refurbishment for BuenBit in Buenos Aires, developed during 2020 across five levels of an existing building. Sean developed the architectural concept and c ity landscape while retaining the directness of traditional rural architecture.","involvement":"Sean developed the architectural concept for this private country house. The project did not proceed, as the client was ultimately unable to acquire the site.","featured":false,"hero":"assets/images/maribor-country-house/01-exterior-pool-c.jpg","images":[{"src":"assets/images/maribor-country-house/01-exterior-pool-c.jpg","alt":"Maribor Country House: Exterior pool"},{"src":"assets/images/maribor-country-house/02-exterior-brick-detail.jpg","alt":"Maribor Country House: Exterior brick detail"},{"src":"assets/images/maribor-country-house/03-living-dining-pool-view.jpg","alt":"Maribor Country House: Living dining pool view"},{"src":"assets/images/maribor-country-house/04-living-room-interior.jpg","alt":"Maribor Country House: Living room interior"},{"src":"assets/images/maribor-country-house/05-living-room-fireplace.jpg","alt":"Maribor Country House: Living room fireplace"}]},{"slug":"belgrano-house","title":"Belgrano House","location":"Belgrano, Buenos Aires, Argentina","year":"2018","area":"","category":"Private Residence / Renovation","status":"Design package complete","developedAt":"","independentLabel":"Independent architectural and interior design consultant for a Buenos Aires furniture and interiors studio","description":"Belgrano House is the renovation of an existing private residence in Belgrano, Buenos Aires, reworked through a restrained contemporary language that balances the character of the original building with a warmer interior atmosphere.","involvement":"Sean was commissioned by a Buenos Aires furniture and interiors studio to develop the architectural and interior design for this renovation on behalf of their client. His work included the renovation concept, interior architecture, lighting, an upper-floor extension and architectural detailing, with furniture selected and supplied by the collaborating studio.","featured":false,"hero":"assets/images/belgrano-house/01-street-facade-c.jpg","images":[{"src":"assets/images/belgrano-house/01-street-facade-c.jpg","alt":"Belgrano House: Street facade"},{"src":"assets/images/belgrano-house/02-dining-kitchen.jpg","alt":"Belgrano House: Dining kitchen"},{"src":"assets/images/belgrano-house/03-staircase.jpg","alt":"Belgrano House: Staircase"},{"src":"assets/images/belgrano-house/04-powder-room.jpg","alt":"Belgrano House: Powder room"}]}]</script>
